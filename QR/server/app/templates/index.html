<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการครุภัณฑ์ QR Code</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <h1 class="mb-4 text-primary">ระบบจัดการครุภัณฑ์ (QR Asset Management)</h1>
        
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <h5 class="card-title">รายการครุภัณฑ์ทั้งหมด</h5>
                <button class="btn btn-success mb-3" onclick="loadAssets()">ดึงข้อมูลครุภัณฑ์</button>
                <div id="asset-list" class="row g-3"></div>
            </div>
        </div>
    </div>

    <script>
        async function loadAssets() {
            try {
                const response = await fetch('/api/assets/');
                const data = await response.json();
                const container = document.getElementById('asset-list');
                container.innerHTML = '';
                
                if (data.length === 0) {
                    container.innerHTML = '<p class="text-muted">ยังไม่มีข้อมูลครุภัณฑ์ในระบบ</p>';
                    return;
                }

                data.forEach(asset => {
                    container.innerHTML += `
                        <div class="col-md-4">
                            <div class="card h-100">
                                <div class="card-body">
                                    <h5 class="card-title">${asset.name}</h5>
                                    <p class="card-text">
                                        <strong>รหัส:</strong> ${asset.asset_code}<br>
                                        <strong>หมวดหมู่:</strong> ${asset.category || '-'}<br>
                                        <strong>สถานที่:</strong> ${asset.location || '-'}
                                    </p>
                                </div>
                            </div>
                        </div>
                    `;
                });
            } catch (err) {
                alert('ไม่สามารถดึงข้อมูลได้: ' + err);
            }
        }
    </script>
</body>
</html>
