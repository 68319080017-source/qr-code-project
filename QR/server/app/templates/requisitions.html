<script>
    const API_URL = '/api/v1';

    async function loadRequisitions() {
        try {
            const res = await fetch(`${API_URL}/requisitions/`);
            if (!res.ok) throw new Error('Network error');
            const data = await res.json();
            const tbody = document.getElementById('requisition-table');
            
            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-6 text-center text-gray-500">ยังไม่มีประวัติการเบิกอุปกรณ์</td></tr>`;
                return;
            }

            tbody.innerHTML = data.map(item => `
                <tr class="hover:bg-gray-800/40 transition">
                    <td class="p-4 text-gray-400">${item.created_at ? new Date(item.created_at).toLocaleString('th-TH') : '-'}</td>
                    <td class="p-4 font-mono font-semibold text-red-400">ID: ${item.asset_id}</td>
                    <td class="p-4 font-medium text-white">${item.requester_name}</td>
                    <td class="p-4 text-gray-300">${item.department}</td>
                    <td class="p-4 text-gray-400">${item.purpose || '-'}</td>
                    <td class="p-4"><span class="px-2.5 py-1 text-xs rounded-full bg-red-500/10 text-red-400 border border-red-500/20">ถูกเบิกออก</span></td>
                </tr>
            `).join('');
        } catch (err) {
            console.error(err);
        }
    }

    async function loadAssetsForSelect() {
        try {
            const res = await fetch(`${API_URL}/assets/`);
            const assets = await res.json();
            const select = document.getElementById('asset_id');
            
            const available = assets.filter(a => a.status !== 'ถูกเบิกออก');
            
            // แก้ไข: ใช้ a.id หรือถ้าไม่มีให้ใช้ a.asset_code เพื่อป้องกันค่า undefined
            select.innerHTML = available.map(a => {
                const itemVal = a.id !== undefined ? a.id : a.asset_code;
                return `<option value="${itemVal}">[${a.asset_code || a.id}] ${a.name}</option>`;
            }).join('');
        } catch (err) {
            console.error(err);
        }
    }

    function openModal() {
        loadAssetsForSelect();
        document.getElementById('req-modal').classList.remove('hidden');
    }

    function closeModal() {
        document.getElementById('req-modal').classList.add('hidden');
    }

    async function submitRequisition(e) {
        e.preventDefault();
        
        const rawAssetId = document.getElementById('asset_id').value;
        const parsedId = parseInt(rawAssetId, 10);
        
        // ตรวจสอบ payload ป้องกัน NaN
        const payload = {
            asset_id: isNaN(parsedId) ? rawAssetId : parsedId,
            requester_name: document.getElementById('requester_name').value,
            department: document.getElementById('department').value,
            purpose: document.getElementById('purpose').value
        };

        try {
            const res = await fetch(`${API_URL}/requisitions/`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                closeModal();
                loadRequisitions();
                document.getElementById('req-form').reset();
                alert('บันทึกการเบิกเรียบร้อยแล้ว!');
            } else {
                // อ่านรายละเอียดข้อผิดพลาดจาก Backend
                const errDetail = await res.text();
                console.error('Server Error:', errDetail);
                alert(`เกิดข้อผิดพลาด (${res.status}): ตรวจสอบการส่งข้อมูลอีกครั้ง`);
            }
        } catch (err) {
            console.error('Fetch Error:', err);
            alert('ไม่สามารถเชื่อมต่อกับ เซิร์ฟเวอร์ ได้');
        }
    }

    loadRequisitions();
</script>
