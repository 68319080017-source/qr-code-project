<script>
let rawMaintenanceData = [];

// ระบบเสียงเอฟเฟกต์ RPG
function playRPGSound(type) {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (type === 'accept') {
            const notes = [440, 554.37, 659.25, 880];
            notes.forEach((freq, idx) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.08);
                gain.gain.setValueAtTime(0.15, ctx.currentTime + idx * 0.08);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.08 + 0.3);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(ctx.currentTime + idx * 0.08);
                osc.stop(ctx.currentTime + idx * 0.08 + 0.3);
            });
        } else if (type === 'complete') {
            const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
            notes.forEach((freq, idx) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.1);
                gain.gain.setValueAtTime(0.2, ctx.currentTime + idx * 0.1);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.1 + 0.4);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(ctx.currentTime + idx * 0.1);
                osc.stop(ctx.currentTime + idx * 0.1 + 0.4);
            });
        }
    } catch (e) {
        console.log("Audio API not supported or blocked");
    }
}

async function loadMaintenanceData() {
    try {
        const res = await fetch('/api/v1/maintenance/');
        if (!res.ok) return;
        rawMaintenanceData = await res.json();

        // ✅ แก้ไข: เพิ่มการกรองสถานะ "เควสใหม่" และสถานะภาษาไทยให้ครบถ้วน
        document.getElementById('countTotal').innerText = rawMaintenanceData.length;
        document.getElementById('countPending').innerText = rawMaintenanceData.filter(i => 
            ['Pending', 'pending', 'รอดำเนินการ', 'เควสใหม่'].includes(i.status)
        ).length;
        document.getElementById('countProgress').innerText = rawMaintenanceData.filter(i => 
            ['In Progress', 'in progress', 'กำลังซ่อม', 'กำลังทำเควส'].includes(i.status)
        ).length;
        document.getElementById('countCompleted').innerText = rawMaintenanceData.filter(i => 
            ['Completed', 'completed', 'ซ่อมเสร็จแล้ว', 'สำเร็จแล้ว', 'Done'].includes(i.status)
        ).length;

        renderTable(rawMaintenanceData);
        updateTrashBadge();
    } catch (err) {
        console.error("Error loading maintenance data:", err);
    }
}

function renderTable(data) {
    const tbody = document.getElementById('maintenanceTableBody');
    tbody.innerHTML = '';

    if (!data || data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center py-5 text-secondary">ไม่พบข้อมูลการแจ้งซ่อมในระบบ</td></tr>`;
        return;
    }

    data.forEach(item => {
        const dateStr = item.created_at ? new Date(item.created_at).toLocaleString('th-TH', {
            year: 'numeric', month: 'numeric', day: 'numeric',
            hour: '2-digit', minute: '2-digit'
        }) : '-';

        let statusBadge = '';
        let actionButtons = '';

        if (['Completed', 'completed', 'ซ่อมเสร็จแล้ว', 'สำเร็จแล้ว'].includes(item.status)) {
            statusBadge = `
                <span class="badge status-badge-completed px-3 py-2 rounded-pill">
                    <i class="bi bi-check-circle-fill me-1"></i> สำเร็จแล้ว
                </span>`;
            actionButtons = `<span class="badge bg-success bg-opacity-25 text-success px-3 py-1.5 rounded-pill" title="ภารกิจเสร็จสิ้น"><i class="bi bi-shield-check me-1"></i> เควสสำเร็จ</span>`;

        } else if (['In Progress', 'in progress', 'กำลังซ่อม'].includes(item.status)) {
            statusBadge = `
                <span class="badge status-badge-progress px-3 py-2 rounded-pill">
                    <i class="bi bi-tools me-1"></i> กำลังดำเนินการ
                </span>`;
            actionButtons = `
                <button class="btn btn-sm btn-success d-inline-flex align-items-center gap-1 px-3 rounded-pill shadow-sm" onclick="confirmComplete(${item.id}, '${item.asset_id}')">
                    <i class="bi bi-check2-circle"></i> ซ่อมเสร็จแล้ว
                </button>`;

        } else { // เควสใหม่ / Pending / รอดำเนินการ
            statusBadge = `
                <span class="badge status-badge-pending px-3 py-2 rounded-pill">
                    <i class="bi bi-hourglass-split me-1"></i> เควสใหม่
                </span>`;
            actionButtons = `
                <button class="btn btn-sm btn-warning d-inline-flex align-items-center gap-1 px-3 rounded-pill shadow-sm fw-bold text-dark" onclick="acceptQuest(${item.id}, '${item.asset_id}')">
                    ⚔️ รับเควส
                </button>`;
        }

        const deleteBtn = `
            <button class="btn btn-sm btn-outline-danger rounded-circle ms-1 p-1" style="width: 31px; height: 31px;" title="ย้ายลงถังขยะ" onclick="softDeleteQuest(${item.id}, '${item.asset_id}')">
                <i class="bi bi-trash-fill"></i>
            </button>`;

        const urgency = item.urgency || 'Normal';
        let urgencyBadgeClass = 'bg-secondary bg-opacity-25 text-light';
        if (urgency === 'High') urgencyBadgeClass = 'bg-warning bg-opacity-25 text-warning border border-warning';
        if (urgency === 'Critical') urgencyBadgeClass = 'bg-danger bg-opacity-25 text-danger border border-danger';

        const tr = document.createElement('tr');
        tr.style.borderBottom = '1px solid rgba(255,255,255,0.03)';
        tr.innerHTML = `
            <td class="fw-bold" style="color: #FFE082;">#${item.asset_id}</td>
            <td><span class="text-light fw-medium">${item.issue_description || '-'}</span></td>
            <td><span class="badge bg-dark border border-secondary text-light px-3 py-1.5 rounded-pill" style="font-weight: 500;">${item.reporter_name || 'ไม่ระบุชื่อ'}</span></td>
            <td><span class="badge ${urgencyBadgeClass} px-2.5 py-1 rounded-3">${urgency}</span></td>
            <td>${statusBadge}</td>
            <td class="text-secondary small">${dateStr}</td>
            <td class="text-end">
                <div class="d-inline-flex align-items-center justify-content-end gap-1">
                    ${actionButtons}
                    ${deleteBtn}
                </div>
            </td>
        `;
        tbody.appendChild(tr);
    });
}

// 🗑️ ฟังก์ชันย้ายลงถังขยะ (Soft Delete)
function softDeleteQuest(id, assetId) {
    Swal.fire({
        title: '🗑️ ย้ายลงถังขยะ?',
        text: `ต้องการย้ายรายการ #${assetId} ไปไว้ใน Recycle Bin ใช่หรือไม่?`,
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#ef4444',
        cancelButtonColor: '#475569',
        confirmButtonText: 'ย้ายลงถังขยะ',
        cancelButtonText: 'ยกเลิก',
        customClass: { popup: 'swal-dark' }
    }).then(async (result) => {
        if (result.isConfirmed) {
            try {
                const res = await fetch(`/api/v1/maintenance/${id}/soft-delete`, { method: 'PUT' });
                if (res.ok) {
                    Swal.fire({
                        title: 'ย้ายลงถังขยะเรียบร้อย!',
                        icon: 'success',
                        timer: 1200,
                        showConfirmButton: false,
                        customClass: { popup: 'swal-dark' }
                    });
                    loadMaintenanceData();
                } else {
                    Swal.fire({ title: 'ข้อผิดพลาด!', text: 'ไม่สามารถลบรายการได้', icon: 'error', customClass: { popup: 'swal-dark' } });
                }
            } catch (err) {
                console.error(err);
            }
        }
    });
}

// 🔄 อัปเดตตัวเลข Badge บนไอคอนถังขยะ
async function updateTrashBadge() {
    try {
        const res = await fetch('/api/v1/maintenance/trash-list');
        if (res.ok) {
            const items = await res.json();
            const badge = document.getElementById('trashCountBadge');
            if (badge) {
                badge.textContent = items.length;
                badge.style.display = items.length > 0 ? 'inline-block' : 'none';
            }
        }
    } catch (e) {
        console.error("Error updating trash badge:", e);
    }
}

// 📂 เปิด Modal ถังขยะ
async function openTrashModal() {
    const modalEl = document.getElementById('trashModal');
    const modal = new bootstrap.Modal(modalEl);
    modal.show();

    const tbody = document.getElementById('trashTableBody');
    tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4 text-secondary"><i class="bi bi-arrow-repeat spin me-2"></i>กำลังโหลดรายการขยะ...</td></tr>';

    try {
        const res = await fetch('/api/v1/maintenance/trash-list');
        const items = await res.json();

        if (items.length === 0) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="5" class="text-center py-5 text-secondary">
                        <i class="bi bi-trash3 fs-1 opacity-25 d-block mb-2"></i>
                        ไม่มีรายการในถังขยะ
                    </td>
                </tr>`;
            return;
        }

        let html = '';
        items.forEach(item => {
            const dateStr = item.created_at ? new Date(item.created_at).toLocaleDateString('th-TH') : '-';
            html += `
                <tr>
                    <td class="ps-3 fw-bold text-warning">#${item.asset_id}</td>
                    <td class="text-light">${item.issue_description || '-'}</td>
                    <td class="text-secondary">${item.reporter_name || 'ไม่ระบุ'}</td>
                    <td class="text-secondary small">${dateStr}</td>
                    <td class="text-end pe-3">
                        <button class="btn btn-sm btn-outline-success rounded-pill px-2.5 py-1 me-1" title="กู้คืนรายการ" onclick="restoreQuest(${item.id}, '${item.asset_id}')">
                            <i class="bi bi-arrow-counterclockwise"></i> กู้คืน
                        </button>
                        <button class="btn btn-sm btn-danger rounded-pill px-2.5 py-1" title="ลบออกจาก DB ถาวร" onclick="permanentDeleteQuest(${item.id}, '${item.asset_id}')">
                            <i class="bi bi-x-circle-fill"></i> ลบถาวร
                        </button>
                    </td>
                </tr>
            `;
        });
        tbody.innerHTML = html;
    } catch (err) {
        tbody.innerHTML = '<tr><td colspan="5" class="text-center py-3 text-danger">เกิดข้อผิดพลาดในการดึงข้อมูลถังขยะ</td></tr>';
    }
}

// ↩️ กู้คืนรายการ
async function restoreQuest(id, assetId) {
    try {
        const res = await fetch(`/api/v1/maintenance/${id}/restore`, { method: 'PUT' });
        if (res.ok) {
            openTrashModal();
            loadMaintenanceData();
        }
    } catch (err) {
        console.error(err);
    }
}

// ❌ ลบรายการถาวรออกจาก DB
function permanentDeleteQuest(id, assetId) {
    Swal.fire({
        title: '⚠️ ยืนยันการลบถาวร?',
        text: `คุณกำลังลบรายการ #${assetId} ออกจากฐานข้อมูลจริง จะไม่สามารถกู้คืนได้อีก!`,
        icon: 'error',
        showCancelButton: true,
        confirmButtonColor: '#dc2626',
        cancelButtonColor: '#475569',
        confirmButtonText: 'ลบถาวรทันที',
        cancelButtonText: 'ยกเลิก',
        customClass: { popup: 'swal-dark' }
    }).then(async (result) => {
        if (result.isConfirmed) {
            try {
                const res = await fetch(`/api/v1/maintenance/${id}/permanent-delete`, { method: 'DELETE' });
                if (res.ok) {
                    openTrashModal();
                    loadMaintenanceData();
                }
            } catch (err) {
                console.error(err);
            }
        }
    });
}

// ⚔️ ฟังก์ชันรับเควส
function acceptQuest(id, assetId) {
    Swal.fire({
        title: '⚔️ ยืนยันการรับเควสซ่อม?',
        text: `คุณกำลังตอบรับภารกิจซ่อมแซมครุภัณฑ์ #${assetId}`,
        icon: 'info',
        showCancelButton: true,
        confirmButtonColor: '#f59e0b',
        cancelButtonColor: '#475569',
        confirmButtonText: '⚔️ ตกลง รับเควส!',
        cancelButtonText: 'ยกเลิก',
        customClass: { popup: 'swal-dark' }
    }).then(async (result) => {
        if (result.isConfirmed) {
            try {
                const res = await fetch(`/api/v1/maintenance/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: 'In Progress' })
                });

                if (res.ok) {
                    playRPGSound('accept');
                    Swal.fire({
                        title: 'รับเควสสำเร็จ!',
                        text: 'เริ่มดำเนินการซ่อมแซมได้เลย!',
                        icon: 'success',
                        timer: 1500,
                        showConfirmButton: false,
                        customClass: { popup: 'swal-dark' }
                    });
                    loadMaintenanceData();
                } else {
                    Swal.fire({
                        title: 'เกิดข้อผิดพลาด!',
                        text: 'ไม่สามารถรับเควสได้ กรุณาลองใหม่อีกครั้ง',
                        icon: 'error',
                        customClass: { popup: 'swal-dark' }
                    });
                }
            } catch (e) {
                Swal.fire({
                    title: 'ข้อผิดพลาดเครือข่าย!',
                    text: 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้',
                    icon: 'error',
                    customClass: { popup: 'swal-dark' }
                });
            }
        }
    });
}

// ✅ ฟังก์ชันส่งเควส/ซ่อมเสร็จ
function confirmComplete(id, assetId) {
    Swal.fire({
        title: '🏆 ยืนยันการซ่อมเสร็จสิ้น?',
        text: `คุณกำลังเปลี่ยนสถานะรายการแจ้งซ่อมครุภัณฑ์ #${assetId} เป็น "ซ่อมเสร็จแล้ว"`,
        icon: 'question',
        showCancelButton: true,
        confirmButtonColor: '#10b981',
        cancelButtonColor: '#475569',
        confirmButtonText: '<i class="bi bi-check-lg me-1"></i> ยืนยันซ่อมเสร็จ',
        cancelButtonText: 'ยกเลิก',
        customClass: { popup: 'swal-dark' }
    }).then(async (result) => {
        if (result.isConfirmed) {
            try {
                const res = await fetch(`/api/v1/maintenance/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: 'Completed' })
                });

                if (res.ok) {
                    playRPGSound('complete');
                    Swal.fire({
                        title: 'ภารกิจเสร็จสิ้น!',
                        text: 'อัปเดตสถานะการซ่อมเรียบร้อยแล้ว',
                        icon: 'success',
                        timer: 1500,
                        showConfirmButton: false,
                        customClass: { popup: 'swal-dark' }
                    });
                    loadMaintenanceData();
                } else {
                    Swal.fire({
                        title: 'เกิดข้อผิดพลาด!',
                        text: 'ไม่สามารถอัปเดตสถานะได้ กรุณาลองใหม่อีกครั้ง',
                        icon: 'error',
                        customClass: { popup: 'swal-dark' }
                    });
                }
            } catch (e) {
                Swal.fire({
                    title: 'ข้อผิดพลาดเครือข่าย!',
                    text: 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้',
                    icon: 'error',
                    customClass: { popup: 'swal-dark' }
                });
            }
        }
    });
}

// ค้นหาข้อมูล real-time
document.getElementById('searchInput').addEventListener('input', function(e) {
    const term = e.target.value.toLowerCase();
    const filtered = rawMaintenanceData.filter(item => 
        (item.issue_description && item.issue_description.toLowerCase().includes(term)) ||
        (item.reporter_name && item.reporter_name.toLowerCase().includes(term)) ||
        (item.asset_id && item.asset_id.toString().includes(term))
    );
    renderTable(filtered);
});

// ✅ แก้ไข: ปรับเวลา Auto-Refresh เพิ่มเป็น 30 วินาที (30000ms) เพื่อป้องกัน Server หนักเกินไป
document.addEventListener('DOMContentLoaded', () => {
    loadMaintenanceData();
    setInterval(loadMaintenanceData, 30000);
});
</script>
