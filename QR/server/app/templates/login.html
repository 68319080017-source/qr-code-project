<!DOCTYPE html>
<html lang="th" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - ระบบจัดการครุภัณฑ์ ไทย-ออสเตรีย</title>
    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --lux-bg: #050811;
            --lux-card: rgba(13, 20, 36, 0.75);
            --lux-border: rgba(255, 255, 255, 0.08);
            --lux-gold: linear-gradient(135deg, #FFE082 0%, #C19A6B 100%);
            --lux-gold-glow: rgba(193, 154, 107, 0.25);
        }

        body {
            font-family: 'Sarabun', 'Plus Jakarta Sans', sans-serif;
            background-color: var(--lux-bg) !important;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(193, 154, 107, 0.08) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(29, 78, 216, 0.1) 0%, transparent 50%);
            overflow: hidden;
        }

        .login-card {
            background: var(--lux-card) !important;
            backdrop-filter: blur(30px);
            border: 1px solid var(--lux-border) !important;
            border-radius: 24px !important;
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 30px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }

        .login-card:hover {
            border-color: rgba(193, 154, 107, 0.3) !important;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 35px var(--lux-gold-glow);
        }

        .brand-logo-img {
            height: 60px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0px 4px 15px rgba(193, 154, 107, 0.3));
        }

        .form-control {
            background-color: rgba(5, 8, 17, 0.7) !important;
            border: 1px solid var(--lux-border) !important;
            color: #ffffff !important;
            border-radius: 12px;
            padding: 0.75rem 1rem 0.75rem 2.8rem;
            font-size: 0.95rem;
        }

        .form-control:focus {
            border-color: #C19A6B !important;
            box-shadow: 0 0 15px rgba(193, 154, 107, 0.25) !important;
        }

        .input-group-text-custom {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 10;
            color: #94a3b8;
        }

        .btn-gold {
            background: var(--lux-gold) !important;
            color: #050811 !important;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            padding: 0.8rem;
            box-shadow: 0 8px 20px var(--lux-gold-glow);
            transition: all 0.25s ease;
        }

        .btn-gold:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(193, 154, 107, 0.4);
            color: #000 !important;
        }

        .cursor-dot {
            width: 8px; height: 8px; background-color: #FFE082;
            position: fixed; top: 0; left: 0; border-radius: 50%;
            pointer-events: none !important; z-index: 9999;
        }
        .cursor-outline {
            width: 36px; height: 36px; border: 1px solid rgba(255, 224, 130, 0.4);
            position: fixed; top: 0; left: 0; border-radius: 50%;
            pointer-events: none !important; z-index: 9998;
            transition: width 0.2s, height 0.2s, border-color 0.2s;
        }
    </style>
</head>
<body>
    <div class="cursor-dot" id="cursorDot"></div>
    <div class="cursor-outline" id="cursorOutline"></div>

    <div class="container d-flex justify-content-center px-3">
        <div class="login-card text-center">
            <div class="mb-4">
                <img src="/static/img/logo.png" alt="Thai-Austrian Logo" class="brand-logo-img mb-3" onerror="this.style.display='none'">
                <h4 class="fw-bold text-white mb-1">เข้าสู่ระบบผู้ดูแล</h4>
                <p class="text-secondary style-small mb-0" style="font-size: 0.8rem; letter-spacing: 1px;">THAI-AUSTRIAN ASSET MANAGEMENT</p>
            </div>

            {% if error %}
            <div class="alert alert-danger border-0 bg-danger bg-opacity-25 text-danger-emphasis py-2 px-3 mb-4 rounded-3 text-start" style="font-size: 0.85rem;">
                <i class="bi bi-exclamation-triangle-fill me-2"></i> {{ error }}
            </div>
            {% endif %}

            <form action="/login" method="POST">
                <div class="mb-3 text-start position-relative">
                    <label class="form-label text-secondary small fw-semibold">ชื่อผู้ใช้งาน (Username)</label>
                    <div class="position-relative">
                        <i class="bi bi-person input-group-text-custom"></i>
                        <input type="text" name="username" class="form-control" placeholder="ระบุ username" required autocomplete="off">
                    </div>
                </div>

                <div class="mb-4 text-start position-relative">
                    <label class="form-label text-secondary small fw-semibold">รหัสผ่าน (Password)</label>
                    <div class="position-relative">
                        <i class="bi bi-key input-group-text-custom"></i>
                        <input type="password" name="password" class="form-control" placeholder="ระบุรหัสผ่าน" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-gold w-100">
                    <i class="bi bi-box-arrow-in-right me-2"></i>เข้าสู่ระบบ
                </button>
            </form>

            <div class="mt-4 pt-3 border-top border-secondary border-opacity-25">
                <small class="text-secondary style-small" style="font-size: 0.75rem;">สงวนลิขสิทธิ์ © วิทยาลัยเทคนิคไทย-ออสเตรีย สัตหีบ</small>
            </div>
        </div>
    </div>

    <script>
        const dot = document.getElementById('cursorDot');
        const outline = document.getElementById('cursorOutline');
        let mouseX = 0, mouseY = 0;

        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX; mouseY = e.clientY;
        }, { passive: true });

        function updateCursor() {
            dot.style.transform = `translate3d(${mouseX - 4}px, ${mouseY - 4}px, 0)`;
            outline.style.transform = `translate3d(${mouseX - 18}px, ${mouseY - 18}px, 0)`;
            requestAnimationFrame(updateCursor);
        }
        requestAnimationFrame(updateCursor);
    </script>
</body>
</html>
