version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: qr_asset_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: qr_asset_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  app:
    build: .
    container_name: qr_asset_app
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=qr_asset_db
      - POSTGRES_PORT=5432
      - SECRET_KEY=change-me-in-production-to-a-random-string
    depends_on:
      - db
    volumes:
      - ./uploads:/app/uploads
      - ./qrcodes:/app/qrcodes
      - ./reports:/app/reports
    restart: unless-stopped

volumes:
  postgres_data:
