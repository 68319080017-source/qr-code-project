<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Enterprise QR Asset{% endblock %}</title>
    
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link href="/static/css/style.css" rel="stylesheet">
    
    {% block extra_css %}{% endblock %}
</head>
<body>
    
    <div class="sidebar animate-fade-in" style="animation-delay: 0.1s;">
        <div class="d-flex align-items-center mb-5 px-3">
            <i class="fa-solid fa-qrcode fs-3 text-primary me-2"></i>
            <h4 class="mb-0 fw-bold text-gradient">QR Asset</h4>
        </div>
        
        <a href="/" class="sidebar-link">
            <i class="fa-solid fa-chart-pie"></i> Dashboard
        </a>
        <a href="/assets-management" class="sidebar-link">
            <i class="fa-solid fa-boxes-stacked"></i> ครุภัณฑ์
        </a>
        <a href="/qr-scanner" class="sidebar-link">
            <i class="fa-solid fa-qrcode"></i> สแกน QR Code
        </a>
        <a href="/audit" class="sidebar-link">
            <i class="fa-solid fa-clipboard-check"></i> ตรวจสอบครุภัณฑ์
        </a>
        <a href="/maintenance" class="sidebar-link">
            <i class="fa-solid fa-wrench"></i> แจ้งซ่อม
        </a>
        <a href="/reports-view" class="sidebar-link">
            <i class="fa-solid fa-chart-bar"></i> รายงาน
        </a>
        <a href="/user-management" class="sidebar-link">
            <i class="fa-solid fa-users-gear"></i> จัดการผู้ใช้
        </a>
        
        <div class="mt-auto pt-5">
            <a href="#" class="sidebar-link text-danger mt-5" onclick="logout()">
                <i class="fa-solid fa-right-from-bracket"></i> Logout
            </a>
        </div>
    </div>

    <div class="main-content">
        <!-- Top Navbar -->
        <nav class="navbar navbar-expand-lg glass-navbar rounded-4 mb-4 px-4 py-3 animate-fade-in" style="animation-delay: 0.2s;">
            <div class="container-fluid">
                <span class="navbar-brand text-light fw-semibold">{% block page_title %}Overview{% endblock %}</span>
                <div class="d-flex align-items-center">
                    <div class="position-relative me-4">
                        <i class="fa-regular fa-bell fs-5 text-gray cursor-pointer"></i>
                        <span class="position-absolute top-0 start-100 translate-middle p-1 bg-danger border border-light rounded-circle">
                            <span class="visually-hidden">New alerts</span>
                        </span>
                    </div>
                    <div class="d-flex align-items-center">
                        <img id="navUserAvatar" src="https://ui-avatars.com/api/?name=User&background=4F46E5&color=fff" alt="User" class="rounded-circle me-2" width="36" height="36">
                        <div>
                            <p class="mb-0 fs-6 fw-medium" id="navUserName">Loading...</p>
                            <p class="mb-0 text-gray" style="font-size: 0.75rem;" id="navUserRole">Role</p>
                        </div>
                    </div>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="animate-fade-in" style="animation-delay: 0.3s;">
            {% block content %}{% endblock %}
        </main>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer" class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1100;"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/static/js/app.js?v=2"></script>
    <script>
        // Check Auth and Load User Info
        async function loadUserInfo() {
            const token = localStorage.getItem('access_token');
            if (!token) {
                window.location.href = '/login';
                return;
            }
            try {
                // Fetch user info
                const user = await apiGet('/users/me');
                if (user) {
                    document.getElementById('navUserName').textContent = user.first_name + ' ' + user.last_name;
                    document.getElementById('navUserRole').textContent = user.is_superuser ? 'Super Admin' : 'User';
                    document.getElementById('navUserAvatar').src = `https://ui-avatars.com/api/?name=${encodeURIComponent(user.first_name)}+${encodeURIComponent(user.last_name)}&background=4F46E5&color=fff`;
                }
            } catch (e) {
                console.error('Failed to load user', e);
            }
        }

        function logout() {
            localStorage.removeItem('access_token');
            window.location.href = '/login';
        }

        document.addEventListener('DOMContentLoaded', loadUserInfo);
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
