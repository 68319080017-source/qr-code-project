<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Scanner | QR Asset</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="/static/css/style.css" rel="stylesheet">
    <style>
        #reader { width: 100%; max-width: 500px; margin: 0 auto; border-radius: 16px; overflow: hidden; }
        #reader video { border-radius: 16px; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height:100vh;">

<div class="container" style="max-width: 540px;">
    <div class="text-center mb-4 animate-fade-in">
        <a href="/" class="btn btn-outline-secondary btn-sm mb-3"><i class="fa-solid fa-arrow-left me-1"></i> กลับหน้าหลัก</a>
        <h3 class="text-gradient fw-bold"><i class="fa-solid fa-qrcode me-2"></i>สแกน QR Code</h3>
        <p class="text-gray small">ใช้กล้องสแกน QR Code ที่ติดบนครุภัณฑ์</p>
    </div>

    <div class="glass-card p-4 mb-4 animate-fade-in" style="animation-delay:0.1s;">
        <div id="reader"></div>
        <div id="scanResult" class="text-center mt-3" style="display:none;">
            <div class="alert alert-success bg-transparent border border-success text-success">
                <i class="fa-solid fa-check-circle me-2"></i><span id="scanResultText"></span>
            </div>
        </div>
    </div>

    <div class="glass-card p-4 animate-fade-in" style="animation-delay:0.2s;">
        <label class="form-label text-gray small">หรือพิมพ์รหัสครุภัณฑ์</label>
        <div class="input-group">
            <input type="text" id="manualCode" class="form-control form-control-dark" placeholder="เช่น IT-2024-00892">
            <button class="btn btn-primary-custom" onclick="manualSearch()"><i class="fa-solid fa-search me-1"></i> ค้นหา</button>
        </div>
    </div>
</div>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const html5QrCode = new Html5Qrcode("reader");

    function onScanSuccess(decodedText) {
        html5QrCode.stop();
        document.getElementById('scanResult').style.display = 'block';
        document.getElementById('scanResultText').textContent = 'พบ: ' + decodedText;

        // If it's a URL, navigate directly; otherwise go to /scan/{code}
        setTimeout(() => {
            if (decodedText.startsWith('http')) {
                window.location.href = decodedText;
            } else {
                window.location.href = '/scan/' + encodeURIComponent(decodedText);
            }
        }, 1000);
    }

    html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 250, height: 250 } },
        onScanSuccess
    ).catch(err => {
        document.getElementById('reader').innerHTML =
            '<div class="text-center p-5 text-warning"><i class="fa-solid fa-camera-slash fs-1 mb-3 d-block"></i>ไม่สามารถเข้าถึงกล้องได้<br><small class="text-gray">กรุณาอนุญาตการเข้าถึงกล้อง หรือพิมพ์รหัสด้านล่าง</small></div>';
    });

    function manualSearch() {
        const code = document.getElementById('manualCode').value.trim();
        if (code) window.location.href = '/scan/' + encodeURIComponent(code);
    }

    document.getElementById('manualCode').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') manualSearch();
    });
</script>
</body>
</html>
